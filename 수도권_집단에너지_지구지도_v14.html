<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수도권 집단에너지 지구 현황 지도 (파주~평택)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:#111827;background:#fff}
#wrap{display:flex;height:100vh}
#side{width:340px;min-width:340px;border-right:1px solid #d1d5db;display:flex;flex-direction:column;overflow:hidden}
#map{flex:1;position:relative}
h1{font-size:15px;margin:0;padding:12px;border-bottom:1px solid #d1d5db;font-weight:700}
.sec{padding:10px 12px;border-bottom:1px solid #e5e7eb}
.sec h2{font-size:12px;margin:0 0 8px;color:#6b7280;font-weight:600;letter-spacing:.02em}
input,select,button,textarea{font-family:inherit;font-size:13px}
input[type=text],select,textarea{width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
button{padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer}
button:hover{background:#f3f4f6}
button.p{background:#2563eb;color:#fff;border-color:#2563eb}
button.p:hover{background:#1d4ed8}
.row{display:flex;gap:6px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;user-select:none;font-size:13px}
.lg:hover{background:#f3f4f6}
.lg.off{opacity:.35}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none}
.cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:#6b7280;font-size:12px}
#list{flex:1;overflow:auto}
.it{padding:7px 12px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.it:hover{background:#f9fafb}
.it.sel{background:#eff6ff}
.it .nm{flex:1;line-height:1.35}
.it .sub{color:#6b7280;font-size:11px}
.bd{display:inline-block;padding:1px 5px;border-radius:4px;font-size:11px;border:1px solid #d1d5db;color:#374151}
#panel{position:absolute;right:12px;top:12px;width:290px;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:12px;display:none;z-index:5;max-height:calc(100% - 24px);overflow:auto}
#panel h3{margin:0 0 8px;font-size:13px}
label{display:block;font-size:11px;color:#6b7280;margin:8px 0 3px}
#tools{position:absolute;left:12px;top:12px;z-index:5;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 340px)}
#msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:9;background:#111827;color:#fff;padding:7px 12px;border-radius:6px;font-size:12px;display:none}
#keybox{position:absolute;inset:0;background:#f9fafb;display:flex;align-items:center;justify-content:center;z-index:8}
#keybox .bx{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:18px;width:440px}
#cv{width:100%;height:100%;display:block;background:#eef1f4}
.note{font-size:11px;color:#6b7280;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border-bottom:1px solid #e5e7eb;padding:3px 4px;text-align:left}

#dhint{position:absolute;left:12px;top:56px;z-index:5;background:#111827;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;display:none;line-height:1.5}
#map.drawmode{cursor:crosshair}
.pinbtn{display:flex;align-items:center;gap:6px}
.pt{display:flex;align-items:center;gap:7px;padding:3px 5px;font-size:12px;color:#374151}
.pi{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex:none}
.pi img{max-width:16px;max-height:15px;display:block}
.sqe{width:12px;height:12px;border:3px solid #e8221f;background:#fff;display:block}
#oplist{max-height:190px;overflow:auto;border:1px solid #e5e7eb;border-radius:6px}
.oi{display:flex;align-items:center;gap:7px;padding:5px 7px;border-bottom:1px solid #f3f4f6;font-size:12px;cursor:pointer}
.oi:hover{background:#f9fafb}
.oi.sel{background:#eff6ff}
.oi .on{flex:1;line-height:1.3}
.oi .ob{font-size:10px;padding:1px 4px;border-radius:3px;border:1px solid #d1d5db;color:#6b7280}
.oi .ob.ok{border-color:#bbf7d0;background:#f0fdf4;color:#15803d}
#legend{max-height:300px;overflow:auto}
#expPanel{position:absolute;right:12px;top:12px;width:300px;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:12px;display:none;z-index:7;max-height:calc(100% - 24px);overflow:auto}
#expPanel h3{margin:0 0 8px;font-size:13px}
.ck{display:flex;align-items:center;gap:5px;font-size:12px;color:#374151;margin:0}
.ck input{width:auto}
@media print{
  #side,#tools,#panel,#expPanel,#msg,#dhint,#keybox{display:none!important}
  #wrap{display:block;height:auto}
  /* 인쇄 시에는 JS가 #map 을 용지 실측 픽셀로 고정하므로 크기를 덮어쓰지 않는다 */
  #map{position:absolute!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;overflow:hidden}
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #pstamp{display:block!important}
}
#pstamp{display:none;position:absolute;left:10px;top:10px;z-index:50;background:rgba(255,255,255,.94);
  border:1px solid #9ca3af;border-radius:4px;padding:5px 10px;font-weight:700;font-size:13px;color:#111827}
#pstamp span{font-weight:400;color:#6b7280;font-size:11px;margin-left:8px}
</style></head><body>
<div id="wrap">
<div id="side">
  <h1>수도권 집단에너지 지구 현황 <span style="font-weight:400;color:#6b7280">파주~평택</span></h1>
  <div class="sec">
    <h2>검색</h2>
    <input type="text" id="q" placeholder="지구명 · 라벨 · 메모 검색">
    <div class="row" style="margin-top:6px">
      <select id="fstep" style="flex:1"><option value="">단계 전체</option></select>
      <select id="fst" style="flex:1"><option value="">상태 전체</option><option value="예정">예정</option><option value="미지정">미지정</option><option value="기존">기존</option></select>
    </div>
    <div class="row" style="margin-top:6px">
      <label style="margin:0;display:flex;align-items:center;gap:5px;font-size:12px;color:#374151"><input type="checkbox" id="onlyLab" style="width:auto"> 라벨 매칭건만</label>
    </div>
  </div>
  <div class="sec">
    <h2>색상 범례 · 클릭 시 표시/숨김</h2>
    <div id="legend"></div>
    <div class="row" style="margin-top:6px">
      <button id="allon">전체 표시</button><button id="alloff">전체 숨김</button>
    </div>
  </div>
  <div class="sec">
    <h2>열원 지점 · 클릭 시 편집</h2>
    <div class="row" style="margin-bottom:6px">
      <label style="margin:0;display:flex;align-items:center;gap:5px;font-size:12px;color:#374151"><input type="checkbox" id="showPin" checked style="width:auto"> 지점 표시</label>
      <label style="margin:0;display:flex;align-items:center;gap:5px;font-size:12px;color:#374151"><input type="checkbox" id="onlyUnset" style="width:auto"> 미배치만</label>
    </div>
    <div id="oplist"></div>
    <div class="note" style="margin-top:6px">목록에서 지점을 고른 뒤 <b>지도를 클릭</b>하면 그 자리에 아이콘이 놓입니다.</div>
  </div>
  <div class="sec" style="padding:8px 12px">
    <div class="row">
      <button class="p" id="saveBtn">저장</button>
      <button id="loadBtn">불러오기</button>
      <button id="bkBtn">백업파일 저장</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="expBtn">GeoJSON 저장</button>
      <button id="impBtn">파일 가져오기</button>
      <button id="resetBtn">초기화</button>
      <input type="file" id="impFile" accept=".json,.geojson" style="display:none">
    </div>
    <div class="note" id="saveInfo" style="margin-top:6px"></div>
  </div>
  <div id="list"></div>
</div>
<div id="map">
  <div id="pstamp"></div>
  <div id="tools">
    <button id="fit">범위 초기화</button>
    <button id="tTerrain">지형</button>
    <button id="tCadastral">지적편집도</button>
    <button id="tHybrid">스카이뷰</button>
    <button id="tLabel">이름표시: 짧게</button>
    <select id="cmode" style="width:auto"><option value="series">색상: 사업자 계열</option><option value="sido">색상: 시·도</option><option value="sgg">색상: 시·군·구</option></select>
    <button id="tExport">내보내기</button>
    <button id="tDraw">영역 그리기</button>
    <button id="tPin">지점 추가</button>
    <select id="pinSel" style="width:auto;display:none"></select>
    <button id="tUndo" style="display:none">점 취소</button>
    <button class="p" id="tDone" style="display:none">그리기 완료</button>
    <button id="tCancel" style="display:none">취소</button>
  </div>
  <div id="dhint"></div>
  <div id="panel"></div>
  <div id="expPanel">
    <h3>화면 내보내기</h3>
    <div class="note">지금 화면에 보이는 범위·색상·라벨·지점을 그대로 그림 파일로 저장합니다.</div>
    <label>제목 (비우면 넣지 않음)</label>
    <input type="text" id="exTitle" value="수도권 집단에너지 지구 현황">
    <label>파일 형식</label>
    <select id="exFmt"><option value="jpg">JPG 이미지</option><option value="png">PNG 이미지 (배경 투명 아님)</option><option value="pdf">PDF (인쇄 대화상자에서 PDF로 저장)</option></select>
    <label>해상도</label>
    <select id="exScale"><option value="1">1배 · 화면 그대로</option><option value="2" selected>2배 · 고화질(권장)</option><option value="3">3배 · 인쇄용</option></select>
    <label>포함할 요소</label>
    <div class="row" style="margin-top:2px">
      <label class="ck"><input type="checkbox" id="exLeg" checked> 범례</label>
      <label class="ck"><input type="checkbox" id="exLab" checked> 지구 이름</label>
      <label class="ck"><input type="checkbox" id="exPin" checked> 열원 지점</label>
    </div>
    <label>지도 영역</label>
    <select id="exArea">
      <option value="view">현재 화면에 보이는 범위</option>
      <option value="all">수도권 전체 범위</option>
      <option value="vis">지금 켜 둔(체크·검색된) 지구가 모두 들어가게</option>
    </select>
    <label>용지 방향 · 비율 (그림·인쇄 공통 적용)</label>
    <select id="exPaper"><option value="auto">자동 (현재 화면 비율에 맞춤)</option><option value="land">A4 가로</option><option value="port">A4 세로</option></select>
    <div class="note" id="exNote" style="margin-top:10px"></div>
    <div class="row" style="margin-top:10px"><button class="p" id="exGo">내보내기</button><button id="exCl">닫기</button></div>
    <div class="row" style="margin-top:6px"><button id="exPrint" style="width:100%">배경지도까지 포함해 인쇄 · PDF</button></div>
  </div>
  <div id="msg"></div>
  <div id="keybox"><div class="bx">
    <div style="font-weight:700;margin-bottom:6px">카카오맵 JavaScript 키</div>
    <div class="note">역·도로·산 등 배경지도를 보려면 <b>JavaScript 키</b>가 필요합니다(REST API 키가 아닙니다). 키 없이도 <b>간이 지도</b>로 경계·색상·검색을 모두 사용할 수 있습니다.<br>키는 이 브라우저에만 저장됩니다.</div>
    <div class="note" id="originInfo" style="margin-top:8px"></div>
    <input type="text" id="kkey" placeholder="예: 0123456789abcdef..." style="margin-top:10px">
    <label style="display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:12px;color:#374151"><input type="checkbox" id="kauto" style="width:auto"> 다음부터 이 키로 자동 연결</label>
    <div class="row" style="margin-top:10px"><button class="p" id="kgo">카카오맵으로 보기</button><button id="kskip">간이 지도로 보기</button></div>

  </div></div>
</div>

function hsl2hex(h,sa,l){

function icoHTML(k,h){
  h=h||18;
  if(k==='KDHC')return '<img src="'+ICON1+'" style="height:'+h+'px;display:block">';
  if(k==='IND') return '<img src="'+ICON2+'" style="height:'+h+'px;display:block">';
  const b=Math.max(3,Math.round(h*0.22)), w=Math.round(h*0.62);
  return '<span style="display:block;width:'+w+'px;height:'+w+'px;border:'+b+'px solid #e8221f;background:#fff"></span>';
}
/* ---------- 지점 아이콘 기준점 ----------
   fx,fy = 아이콘 그림 안에서 "좌표가 찍히는 자리"의 비율 (0=좌/상, 1=우/하)
   KDHC 아이콘은 아래가 뾰족한 핀 모양이라 끝점(fy:1)이 실제 위치를 가리킵니다.
   ※ 핀 끝이 아니라 그림 한가운데를 좌표에 맞추고 싶으면 KDHC 값을 {fx:0.5,fy:0.5}로 바꾸세요. */
const PIN_ANCHOR={ KDHC:{fx:0.564,fy:1.0}, IND:{fx:0.5,fy:0.5}, ETC:{fx:0.5,fy:0.5} };
function pinAnchor(k){ return PIN_ANCHOR[k]||PIN_ANCHOR.ETC; }
function icoWpx(k,h){
  if(k==='KDHC'&&IMG1.complete&&IMG1.naturalWidth) return h*IMG1.naturalWidth/IMG1.naturalHeight;
  if(k==='IND' &&IMG2.complete&&IMG2.naturalWidth) return h*IMG2.naturalWidth/IMG2.naturalHeight;
  if(k==='KDHC') return h*47/40;
  if(k==='IND')  return h*43/40;
  return Math.round(h*0.62);
}

let ST=null, kmap=null, useKakao=false, labelMode=0, sel=null, selOp=null;
const off=new Set();
let mode=null, dpts=[], pinKind='KDHC', pinTarget=null;

const LAB_MAXLEN=7;
const SUF=['공공주택지구','택지개발사업지구','도시개발사업구역','도시개발사업지구','재정비촉진지구','일반산업단지','국가산업단지','도시첨단산업단지','농공단지','산업단지','지구단위계획구역','경제자유구역','택지개발지구','공공주택','도시개발','뉴스테이','신도시','지구'];
function shortName(z){
  if(z._sn)return z._sn;
  let t=String(z.L||z.n||'').replace(/\([^)]*\)/g,'').trim();
  for(const su of SUF){ if(t.length>su.length+1 && t.endsWith(su)){ t=t.slice(0,-su.length).trim(); break; } }
  t=t.replace(/\s+/g,'');
  if(!t)t=String(z.L||z.n||'');
  if(t.length>LAB_MAXLEN)t=t.slice(0,LAB_MAXLEN)+'…';
  z._sn=t; return t;
}
function labText(z){ return labelMode===1 ? String(z.L||z.n) : shortName(z); }
function areaNum(z){ const v=parseFloat(String(z.a||'0').replace(/,/g,'')); return isFinite(v)?v:0; }

/* ---------- 상태 ---------- */
function fresh(){return {zones:SEED_Z.map(z=>Object.assign({},z)), ops:SEED_OP.map(o=>Object.assign({k:defKind(o.c)},o)), ts:null};}
function readStore(){try{const r=localStorage.getItem(SKEY); if(r){const d=JSON.parse(r); if(d&&d.zones)return d;}}catch(e){} return null;}
function applyEdits(base,d){
  if(!d)return 0; let n=0;
  (d.zones||[]).forEach(sv=>{
    let z=base.zones.find(x=>x.id===sv.id);
    if(!z){ if(sv.u&&sv.g){ base.zones.push(Object.assign({},sv)); n++; } return; }
    if(sv.c)z.c=sv.c; if(sv.st)z.st=sv.st;
    if(sv.memo!==undefined&&sv.memo!=='')z.memo=sv.memo; n++;
  });
  (d.ops||[]).forEach(sv=>{
    let o=base.ops.find(x=>x.id===sv.id);
    if(!o){ base.ops.push(Object.assign({},sv)); n++; return; }
    if(sv.n)o.n=sv.n; if(sv.c)o.c=sv.c; if(sv.k)o.k=sv.k;
    if(sv.lat!=null)o.lat=sv.lat; if(sv.lng!=null)o.lng=sv.lng;
    if(sv.memo!==undefined&&sv.memo!=='')o.memo=sv.memo; n++;
  });
  if(d.ts)base.ts=d.ts; return n;
}
function load(){const base=fresh(); const d=readStore(); if(d)applyEdits(base,d); return base;}
function lightState(){
  return {v:3,ts:ST.ts,
    zones:ST.zones.map(z=>z.u?({id:z.id,n:z.n,s:z.s,a:z.a,c:z.c,st:z.st||'',L:z.L||'',memo:z.memo||'',g:z.g,cx:z.cx,cy:z.cy,u:1})
                            :({id:z.id,c:z.c,st:z.st||'',memo:z.memo||''})),
    ops:ST.ops.map(o=>({id:o.id,n:o.n,c:o.c,k:o.k||defKind(o.c),lat:o.lat,lng:o.lng,memo:o.memo||'',u:o.u?1:0}))};
}
function save(){
  ST.ts=new Date().toISOString();
  try{localStorage.setItem(SKEY,JSON.stringify(lightState()));}
  catch(e){toast('브라우저 저장 공간이 부족합니다. [백업파일 저장]을 사용하세요');return;}
  saveInfoText();
}
function saveInfoText(){
  const d=readStore();
  document.getElementById('saveInfo').textContent = (d&&d.ts)
    ? ('브라우저 저장본 있음 · '+new Date(d.ts).toLocaleString('ko-KR')+' · [불러오기]로 복원')
    : '저장본 없음 · 편집 후 [저장]을 누르세요';
}
function toast(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',2600);}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

ST=load();

function visible(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fs=document.getElementById('fstep').value, fst=document.getElementById('fst').value;
  const ol=document.getElementById('onlyLab').checked;
  return ST.zones.filter(z=>{
    if(off.has(gkey(z)))return false;
    if(fs&&z.s!==fs)return false;
    if(fst&&(z.st||'기존')!==fst)return false;
    if(ol&&!z.L)return false;
    if(q&&!((z.n+' '+(z.L||'')+' '+(z.memo||'')).toLowerCase().includes(q)))return false;
    return true;
  });
}
function visibleOps(){
  if(!document.getElementById('showPin').checked)return [];
  const q=document.getElementById('q').value.trim().toLowerCase();
  return ST.ops.filter(o=>{
    if(o.lat==null||o.lng==null)return false;
    if(colorMode==='series'&&off.has(o.c))return false;
    if(q&&!((o.n+' '+(o.memo||'')).toLowerCase().includes(q)))return false;
    return true;
  });
}

/* ---------- 범례 ---------- */
function groupItems(){
  if(colorMode==='series'){
    return SERIES.map(s=>({k:s.k,n:s.n,col:s.col,line:LINE[s.k],
      c:ST.zones.filter(z=>z.c===s.k).length+ST.ops.filter(o=>o.c===s.k).length}));
  }
  const cnt={};
  ST.zones.forEach(z=>{const k=gkey(z); cnt[k]=(cnt[k]||0)+1;});
  return Object.keys(cnt).sort().map(k=>({k:k,n:gname(k),col:REGCOL[k]||'#cccccc',line:shade(REGCOL[k]||'#cccccc',-40),c:cnt[k]}));
}
function drawLegend(){
  const el=document.getElementById('legend'); el.innerHTML='';
  groupItems().forEach(it=>{
    const d=document.createElement('div'); d.className='lg'+(off.has(it.k)?' off':'');
    d.innerHTML='<span class="sw" style="background:'+it.col+';border-color:'+it.line+'"></span><span>'+esc(it.n)+'</span><span class="cnt">'+it.c+'</span>';
    d.onclick=()=>{off.has(it.k)?off.delete(it.k):off.add(it.k);drawLegend();drawOpList();render();};

  el.appendChild(t);
}

function polyArea(pts){
  if(pts.length<3)return 0;
  const la=pts.reduce((a,p)=>a+p[1],0)/pts.length;
  const mx=111320*Math.cos(la*Math.PI/180), my=110574;
  let s=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    s+=(pts[j][0]*mx)*(pts[i][1]*my)-(pts[i][0]*mx)*(pts[j][1]*my);
  }
  return Math.abs(s/2);
}
function finishDraw(){
  if(dpts.length<3){toast('꼭짓점을 3개 이상 찍어 주세요');return;}
  const pts=dpts.slice(); pts.push(pts[0].slice());
  const ar=polyArea(dpts);
  const cx=dpts.reduce((a,p)=>a+p[0],0)/dpts.length, cy=dpts.reduce((a,p)=>a+p[1],0)/dpts.length;
  const id='USR'+Date.now();
  const z={id:id,n:'새 영역',s:'US',a:ar.toLocaleString('ko-KR',{maximumFractionDigits:1}),c:'NONE',st:'기존',L:'',memo:'',g:[[pts]],cx:cx,cy:cy,u:1};
  ST.zones.push(z); setMode(null); sel=id; selOp=null;
  save();drawLegend();drawList();render();openPanel(z);toast('영역을 추가했습니다. 이름과 색상을 지정하세요');
}
function addPinAt(lat,lng){
  let o=pinTarget;
  if(!o){
    const id='UP'+Date.now();
    o={id:id,n:'새 지점',c:(pinKind==='KDHC'?'KDHC':(pinKind==='IND'?'IND':'UNK')),k:pinKind,lat:lat,lng:lng,memo:'',u:1};
    ST.ops.push(o);
  } else { o.lat=lat; o.lng=lng; }
  selOp=o.id; setMode(null);
  save();drawLegend();drawOpList();render();openOpPanel(o);
  toast('지점을 배치했습니다. 이름을 확인하세요');
}
function onMapClick(lng,lat){
  if(mode==='draw'){ dpts.push([lng,lat]); drawPreview(); }
  else if(mode==='pin'){ addPinAt(lat,lng); }
}

/* ---------- Kakao ---------- */
let polys=[],labels=[],pins=[],prevLine=null,prevPoly=null,prevDots=[];
function kLabSize(){
  const lv=kmap?kmap.getLevel():7;
  return Math.max(10,Math.min(12,Math.round(9.5+lv*0.25)));
}
function kPreview(){
  if(prevLine){prevLine.setMap(null);prevLine=null;}
  if(prevPoly){prevPoly.setMap(null);prevPoly=null;}
  prevDots.forEach(d=>d.setMap(null)); prevDots=[];
  if(mode!=='draw'||!dpts.length||!kmap)return;
  const path=dpts.map(p=>new kakao.maps.LatLng(p[1],p[0]));
  if(dpts.length>=3){
    prevPoly=new kakao.maps.Polygon({map:kmap,path:path,strokeWeight:2,strokeColor:'#2563eb',strokeOpacity:.9,strokeStyle:'shortdash',fillColor:'#2563eb',fillOpacity:.18});
  }else if(dpts.length===2){
    prevLine=new kakao.maps.Polyline({map:kmap,path:path,strokeWeight:2,strokeColor:'#2563eb',strokeOpacity:.9,strokeStyle:'shortdash'});
  }
  dpts.forEach(p=>{
    prevDots.push(new kakao.maps.CustomOverlay({map:kmap,position:new kakao.maps.LatLng(p[1],p[0]),xAnchor:.5,yAnchor:.5,zIndex:9,
      content:'<div style="width:9px;height:9px;border-radius:50%;background:#2563eb;border:2px solid #fff"></div>'}));
  });
}
function renderKakao(){
  polys.forEach(p=>p.setMap(null));labels.forEach(l=>l.setMap(null));pins.forEach(p=>p.setMap(null));
  polys=[];labels=[];pins=[];
  const v=visible();
  v.forEach(z=>{
    const c=zCol(z), ln=zLine(z);
    z.g.forEach(poly=>{
      const path=poly[0].map(pt=>new kakao.maps.LatLng(pt[1],pt[0]));
      const pg=new kakao.maps.Polygon({map:kmap,path:path,strokeWeight:zLW(z,(z.u?3:2)),strokeColor:ln,
        strokeOpacity:.95,strokeStyle:(z.st==='예정'?'shortdash':'solid'),fillColor:c,fillOpacity:zFop(z,.35)});
      kakao.maps.event.addListener(pg,'click',()=>{if(mode)return;sel=z.id;selOp=null;openPanel(z);drawList();render();});
      kakao.maps.event.addListener(pg,'mouseover',()=>pg.setOptions({fillOpacity:.6}));
      kakao.maps.event.addListener(pg,'mouseout',()=>pg.setOptions({fillOpacity:zFop(z,.35)}));
      polys.push(pg);
    });
  });
  /* 지점 */
  visibleOps().forEach(o=>{
    const k=o.k||defKind(o.c);
    const h=19, w=icoWpx(k,h), an=pinAnchor(k);
    /* 래퍼는 크기 0 → 좌표가 곧 원점. 아이콘·이름표를 원점 기준으로 절대배치하므로
       이름 길이가 길어져도, 배율이 바뀌어도 아이콘 기준점이 밀리지 않습니다. */
    const el=document.createElement('div');

  if(labelMode!==2){

/* ---------- 간이 캔버스 지도 ---------- */
const CV={cx:127.05,cy:37.45,z:1,W:0,H:0,k:1,z0:0};
let cvEl=null,ctx=null;
const IMG1=new Image(), IMG2=new Image();
IMG1.src=ICON1; IMG2.src=ICON2;
IMG1.onload=()=>{ useKakao?render():renderCanvas(); };
IMG2.onload=()=>{ useKakao?render():renderCanvas(); };
function ensureCanvas(){
  if(cvEl)return;
  const m=document.getElementById('map');
  cvEl=document.createElement('canvas');cvEl.id='cv';m.appendChild(cvEl);ctx=cvEl.getContext('2d');
  let drag=null;
  cvEl.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,cx:CV.cx,cy:CV.cy,moved:false};};
  cvEl.ondblclick=e=>{if(mode==='draw')finishDraw();};
  window.onmouseup=e=>{
    if(drag&&!drag.moved){
      const r=cvEl.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
      if(mx>=0&&my>=0&&mx<=CV.W&&my<=CV.H){
        if(mode){ const g=S2P(mx,my); onMapClick(g[0],g[1]); }
        else{
          const op=pickOp(mx,my);
          if(op){selOp=op.id;sel=null;openOpPanel(op);drawOpList();drawList();renderCanvas();}
          else{const p=pick(mx,my); if(p){sel=p.id;selOp=null;openPanel(p);drawList();renderCanvas();}}
        }
      }
    }
    drag=null;};
  window.onmousemove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
    if(!drag.moved)return;
    CV.cx=drag.cx-dx/CV.k;CV.cy=drag.cy+dy/(CV.k*0.79);renderCanvas();};
  cvEl.onwheel=e=>{e.preventDefault();CV.z*=(e.deltaY<0?1.18:1/1.18);CV.z=Math.min(4000,Math.max(20,CV.z));renderCanvas();};
  window.addEventListener('resize',()=>{sizeCanvas();renderCanvas();});
  sizeCanvas();fitCanvas();
}
function sizeCanvas(){const m=document.getElementById('map');CV.W=m.clientWidth;CV.H=m.clientHeight;
  const r=window.devicePixelRatio||1;cvEl.width=CV.W*r;cvEl.height=CV.H*r;ctx.setTransform(r,0,0,r,0,0);}
function fitCanvas(){CV.cx=(BOUNDS.w+BOUNDS.e)/2;CV.cy=(BOUNDS.s+BOUNDS.n)/2;
  CV.k=Math.min(CV.W/(BOUNDS.e-BOUNDS.w),CV.H/((BOUNDS.n-BOUNDS.s)*0.79))*0.92;CV.z=CV.k;CV.z0=CV.k;renderCanvas();}
function P2S(x,y){const k=CV.z;return [CV.W/2+(x-CV.cx)*k, CV.H/2-(y-CV.cy)*k*0.79];}
function S2P(sx,sy){const k=CV.z;return [CV.cx+(sx-CV.W/2)/k, CV.cy-(sy-CV.H/2)/(k*0.79)];}
function cvLabSize(){const base=CV.z0||CV.z;return Math.max(10,Math.min(12,Math.round(12*Math.pow(base/CV.z,0.25))));}
function renderCanvas(){
  if(!ctx)return; CV.k=CV.z;
  ctx.clearRect(0,0,CV.W,CV.H);ctx.fillStyle='#eef1f4';ctx.fillRect(0,0,CV.W,CV.H);
  ctx.strokeStyle='#dde2e8';ctx.lineWidth=1;
  for(let lo=126.5;lo<=127.7;lo+=0.1){const a=P2S(lo,BOUNDS.s),b=P2S(lo,BOUNDS.n);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  for(let la=36.9;la<=38.05;la+=0.1){const a=P2S(BOUNDS.w,la),b=P2S(BOUNDS.e,la);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  const v=visible();
  v.forEach(z=>{
    const c=zCol(z), ln=zLine(z);
    z.g.forEach(poly=>{
      ctx.beginPath();
      poly[0].forEach((pt,i)=>{const s=P2S(pt[0],pt[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);});
      ctx.closePath();ctx.fillStyle=rgba(c,zFop(z,.4));ctx.fill();
      ctx.strokeStyle=ln;ctx.lineWidth=(sel===z.id?3:zLW(z,(z.u?2.4:1.4)));
      ctx.setLineDash(z.st==='예정'?[5,4]:[]);ctx.stroke();ctx.setLineDash([]);
    });
  });
  /* 라벨 */
  if(labelMode!==2){
    const fs=cvLabSize(); const boxes=[];
    ctx.font='700 '+fs+'px Pretendard, sans-serif';ctx.textAlign='left';
    const ord=v.slice().sort((a,b)=>(sel===b.id?1:0)-(sel===a.id?1:0)||areaNum(b)-areaNum(a));
    ord.forEach(z=>{
      const t=labText(z); if(!t)return;
      const s=P2S(z.cx,z.cy);
      if(s[0]<-80||s[0]>CV.W+80||s[1]<-40||s[1]>CV.H+40)return;
      const w=ctx.measureText(t).width+10, h=fs+6;
      const bx={x1:s[0]-w/2,y1:s[1]-h/2,x2:s[0]+w/2,y2:s[1]+h/2};
      if(boxes.some(b=>!(bx.x2<b.x1||bx.x1>b.x2||bx.y2<b.y1||bx.y1>b.y2)))return;
      boxes.push(bx);
      const on=(sel===z.id);
      ctx.fillStyle=on?'rgba(17,24,39,.88)':'rgba(255,255,255,.6)';
      ctx.fillRect(bx.x1,bx.y1,w,h);
      ctx.fillStyle=zLine(z); ctx.fillRect(bx.x1+1,bx.y1+2,3,h-4);
      ctx.fillStyle=on?'#fff':'#111827';
      ctx.fillText(t,bx.x1+7,s[1]+fs*0.36);
    });
  }
  /* 지점 */
  visibleOps().forEach(o=>{
    const s=P2S(o.lng,o.lat); const k=o.k||defKind(o.c); const h=19;
    if(s[0]<-60||s[0]>CV.W+60||s[1]<-40||s[1]>CV.H+40)return;
    const an=pinAnchor(k); let wIco=icoWpx(k,h);
    const bx=s[0]-wIco*an.fx, by=s[1]-h*an.fy;
    if(k==='KDHC'&&IMG1.complete&&IMG1.naturalWidth){ctx.drawImage(IMG1,bx,by,wIco,h);}
    else if(k==='IND'&&IMG2.complete&&IMG2.naturalWidth){ctx.drawImage(IMG2,bx,by,wIco,h);}
    else{ctx.fillStyle='#fff';ctx.fillRect(s[0]-6,s[1]-6,12,12);ctx.strokeStyle='#e8221f';ctx.lineWidth=3;ctx.strokeRect(s[0]-6,s[1]-6,12,12);wIco=12;}
    ctx.font='700 11px Pretendard, sans-serif';ctx.textAlign='left';
    const tw=ctx.measureText(o.n).width;
    const lx=bx+wIco+4, ly=by+h/2-8;
    ctx.fillStyle='#fff';ctx.fillRect(lx,ly,tw+8,16);
    ctx.strokeStyle='#111827';ctx.lineWidth=1.5;ctx.strokeRect(lx,ly,tw+8,16);
    ctx.fillStyle='#111827';ctx.fillText(o.n,lx+4,ly+11.5);
  });
  /* 그리기 미리보기 */
  if(mode==='draw'&&dpts.length){
    ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.setLineDash([5,4]);
    ctx.beginPath();
    dpts.forEach((p,i)=>{const s=P2S(p[0],p[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);});
    if(dpts.length>=3){ctx.closePath();ctx.fillStyle='rgba(37,99,235,.18)';ctx.fill();}
    ctx.stroke();ctx.setLineDash([]);
    dpts.forEach(p=>{const s=P2S(p[0],p[1]);ctx.beginPath();ctx.arc(s[0],s[1],4.5,0,Math.PI*2);
      ctx.fillStyle='#2563eb';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();});
  }
  ctx.fillStyle='#6b7280';ctx.font='11px Pretendard, sans-serif';ctx.textAlign='left';
  ctx.fillText('간이 지도 · 드래그 이동, 휠 확대 · 배경지도를 보려면 카카오 키를 입력하세요',10,CV.H-10);
}
function pickOp(mx,my){
  const v=visibleOps();
  for(let i=v.length-1;i>=0;i--){const o=v[i];const s=P2S(o.lng,o.lat);
    const k=o.k||defKind(o.c), an=pinAnchor(k), h=19, w=icoWpx(k,h);
    const bx=s[0]-w*an.fx, by=s[1]-h*an.fy;
    if(mx>=bx-3&&mx<=bx+w+3&&my>=by-3&&my<=by+h+3)return o;}
  return null;
}
function pick(mx,my){
  const v=visible();
  for(let i=v.length-1;i>=0;i--){const z=v[i];
    for(const poly of z.g){const pts=poly[0].map(pt=>P2S(pt[0],pt[1]));
      let inside=false;
      for(let a=0,b=pts.length-1;a<pts.length;b=a++){
        if((pts[a][1]>my)!==(pts[b][1]>my)&&mx<(pts[b][0]-pts[a][0])*(my-pts[a][1])/(pts[b][1]-pts[a][1])+pts[a][0])inside=!inside;}
      if(inside)return z;}}
  return null;
}


/* ---------- 화면 내보내기 (JPG · PNG · PDF) ---------- */
function mapSize(){const m=document.getElementById('map');return [m.clientWidth||1200,m.clientHeight||800];}
function simplifyRing(ring,minD){
  if(!minD||ring.length<40)return ring;
  const out=[ring[0]]; let last=ring[0];
  for(let i=1;i<ring.length-1;i++){
    const p=ring[i];
    if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])>=minD){out.push(p);last=p;}
  }
  out.push(ring[ring.length-1]);
  return out;
}
function drawPinOn(g,x,y,o,showName,noAnchor){
  const k=o.k||defKind(o.c), h=19;
  const an=noAnchor?{fx:.5,fy:.5}:pinAnchor(k);
  let wIco=icoWpx(k,h);
  const bx=x-wIco*an.fx, by=y-h*an.fy;
  if(k==='KDHC'&&IMG1.complete&&IMG1.naturalWidth){
    g.drawImage(IMG1,bx,by,wIco,h);
  }else if(k==='IND'&&IMG2.complete&&IMG2.naturalWidth){
    g.drawImage(IMG2,bx,by,wIco,h);
  }else{
    wIco=12; g.fillStyle='#fff'; g.fillRect(x-6,y-6,12,12);
    g.strokeStyle='#e8221f'; g.lineWidth=3; g.strokeRect(x-6,y-6,12,12);
  }
  if(!showName)return;
  g.font='700 11px Pretendard, sans-serif'; g.textAlign='left';
  const tw=g.measureText(o.n).width, lx=bx+wIco+4, ly=by+h/2-8;
  g.fillStyle='#fff'; g.fillRect(lx,ly,tw+8,16);
  g.strokeStyle='#111827'; g.lineWidth=1.5; g.strokeRect(lx,ly,tw+8,16);
  g.fillStyle='#111827'; g.fillText(o.n,lx+4,ly+11.5);
}
function drawLegendBox(g,W,H,opt){
  const items=groupItems().filter(it=>!off.has(it.k)&&it.c>0);
  const pins=opt.pin?PKIND.slice():[];
  if(!items.length&&!pins.length)return;
  const rowH=15, colW=132, pad=9, head=17;
  let cols=1, rows=items.length;
  while(head+pad*2+rows*rowH+(pins.length?pins.length*17+8:0) > H-24 && cols<4){cols++; rows=Math.ceil(items.length/cols);}
  const bw=pad*2+colW*cols, bh=head+pad*2+rows*rowH+(pins.length?pins.length*17+8:0);
  const bx=W-10-bw, by=H-10-bh;
  g.fillStyle='rgba(255,255,255,.94)'; g.fillRect(bx,by,bw,bh);
  g.strokeStyle='#9ca3af'; g.lineWidth=1; g.strokeRect(bx+.5,by+.5,bw-1,bh-1);
  g.textAlign='left'; g.fillStyle='#111827'; g.font='700 11px Pretendard, sans-serif';
  const ttl = colorMode==='series'?'사업자 계열':(colorMode==='sido'?'시·도 구분':'시·군·구 구분');
  g.fillText(ttl,bx+pad,by+pad+8);
  g.fillStyle='#6b7280'; g.font='10px Pretendard, sans-serif'; g.textAlign='right';
  g.fillText(new Date().toLocaleDateString('ko-KR'),bx+bw-pad,by+pad+8);
  g.textAlign='left';
  items.forEach((it,i)=>{
    const cI=Math.floor(i/rows), rI=i%rows;
    const x=bx+pad+cI*colW, y=by+head+pad+rI*rowH;
    g.fillStyle=it.col; g.fillRect(x,y+2,10,10);
    g.strokeStyle=it.line; g.lineWidth=1; g.strokeRect(x+.5,y+2.5,9,9);
    g.fillStyle='#111827'; g.font='10.5px Pretendard, sans-serif';
    let t=it.n; if(t.length>11)t=t.slice(0,11)+'…';
    g.fillText(t,x+14,y+11);
    g.fillStyle='#6b7280'; g.textAlign='right'; g.fillText(String(it.c),x+colW-8,y+11); g.textAlign='left';
  });
  if(pins.length){
    let y=by+head+pad+rows*rowH+6;
    g.strokeStyle='#e5e7eb'; g.beginPath(); g.moveTo(bx+pad,y-3); g.lineTo(bx+bw-pad,y-3); g.stroke();
    pins.forEach(p=>{
      drawPinOn(g,bx+pad+8,y+8,{n:'',c:p.k,k:p.k},false,true);
      g.fillStyle='#111827'; g.font='10.5px Pretendard, sans-serif'; g.textAlign='left';
      g.fillText(p.n,bx+pad+22,y+12);
      y+=17;
    });
  }
}
function exportCanvas(opt){
  const sz=mapSize(), W=sz[0], H=sz[1], sc=opt.scale;
  const cv=document.createElement('canvas');
  cv.width=Math.round(W*sc); cv.height=Math.round(H*sc);
  const g=cv.getContext('2d'); g.setTransform(sc,0,0,sc,0,0);
  g.fillStyle=opt.bg; g.fillRect(0,0,W,H);
  let proj, minD;
  if(useKakao&&kmap){
    const pj=kmap.getProjection();
    proj=(lng,lat)=>{const p=pj.containerPointFromCoords(new kakao.maps.LatLng(lat,lng)); return [p.x,p.y];};
    const a=proj(127,37.5), b=proj(127.02,37.5);
    const dx=Math.abs(b[0]-a[0])||1;
    minD=(0.02/dx)*0.7;
  }else{
    proj=(lng,lat)=>P2S(lng,lat);
    minD=0.7/Math.max(1,CV.z);
    g.strokeStyle='#dde2e8'; g.lineWidth=1;
    for(let lo=126.5;lo<=127.7;lo+=0.1){const a=proj(lo,BOUNDS.s),b=proj(lo,BOUNDS.n);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
    for(let la=36.9;la<=38.05;la+=0.1){const a=proj(BOUNDS.w,la),b=proj(BOUNDS.e,la);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
  }
  const v=visible();
  v.forEach(z=>{
    const col=zCol(z), ln=zLine(z);
    z.g.forEach(poly=>{
      const ring=simplifyRing(poly[0],minD);
      if(ring.length<3)return;
      let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
      const pts=new Array(ring.length);
      for(let i=0;i<ring.length;i++){
        const p=proj(ring[i][0],ring[i][1]); pts[i]=p;
        if(p[0]<mnx)mnx=p[0]; if(p[0]>mxx)mxx=p[0]; if(p[1]<mny)mny=p[1]; if(p[1]>mxy)mxy=p[1];
      }
      if(mxx<-30||mnx>W+30||mxy<-30||mny>H+30)return;
      g.beginPath();
      for(let i=0;i<pts.length;i++){ i?g.lineTo(pts[i][0],pts[i][1]):g.moveTo(pts[i][0],pts[i][1]); }
      g.closePath();
      g.fillStyle=rgba(col,zFop(z,.4)); g.fill();
      g.strokeStyle=ln; g.lineWidth=zLW(z,z.u?2.4:1.4);
      g.setLineDash(z.st==='예정'?[5,4]:[]); g.stroke(); g.setLineDash([]);
    });
  });
  if(opt.lab&&labelMode!==2){
    const fs=(useKakao&&kmap)?kLabSize():cvLabSize();
    const boxes=[];
    g.font='700 '+fs+'px Pretendard, sans-serif'; g.textAlign='left';
    const ord=v.slice().sort((a,b)=>areaNum(b)-areaNum(a));
    ord.forEach(z=>{
      const t=labText(z); if(!t)return;
      const p=proj(z.cx,z.cy);
      if(p[0]<-80||p[0]>W+80||p[1]<-40||p[1]>H+40)return;
      const w=g.measureText(t).width+10, h=fs+6;
      const bx={x1:p[0]-w/2,y1:p[1]-h/2,x2:p[0]+w/2,y2:p[1]+h/2};
      if(boxes.some(b=>!(bx.x2<b.x1||bx.x1>b.x2||bx.y2<b.y1||bx.y1>b.y2)))return;
      boxes.push(bx);
      g.fillStyle='rgba(255,255,255,.72)'; g.fillRect(bx.x1,bx.y1,w,h);
      g.fillStyle=zLine(z); g.fillRect(bx.x1+1,bx.y1+2,3,h-4);
      g.fillStyle='#111827'; g.fillText(t,bx.x1+7,p[1]+fs*0.36);
    });
  }
  if(opt.pin){
    visibleOps().forEach(o=>{
      const p=proj(o.lng,o.lat);
      if(p[0]<-60||p[0]>W+60||p[1]<-40||p[1]>H+40)return;
      drawPinOn(g,p[0],p[1],o,true);
    });
  }
  if(opt.title){
    g.font='700 14px Pretendard, sans-serif'; g.textAlign='left';
    const tw=g.measureText(opt.title).width;
    g.fillStyle='rgba(255,255,255,.94)'; g.fillRect(10,10,tw+22,30);
    g.strokeStyle='#9ca3af'; g.lineWidth=1; g.strokeRect(10.5,10.5,tw+21,29);
    g.fillStyle='#111827'; g.fillText(opt.title,21,30);
  }
  if(opt.legend)drawLegendBox(g,W,H,opt);
  return cv;
}
function openPrint(url,w,h,title){

/* ---------- 내보내기 영역 · 용지 적용 ---------- */
function exVal(id,dv){ const e=document.getElementById(id); return e?e.value:dv; }
function areaBounds(kind){
  if(kind==='all')return {s:BOUNDS.s,w:BOUNDS.w,n:BOUNDS.n,e:BOUNDS.e};
  if(kind==='vis'){
    let s=99,w=999,n=-99,e=-999,any=false;
    visible().forEach(z=>z.g.forEach(poly=>poly[0].forEach(pt=>{
      any=true; if(pt[0]<w)w=pt[0]; if(pt[0]>e)e=pt[0]; if(pt[1]<s)s=pt[1]; if(pt[1]>n)n=pt[1];
    })));
    visibleOps().forEach(o=>{
      any=true; if(o.lng<w)w=o.lng; if(o.lng>e)e=o.lng; if(o.lat<s)s=o.lat; if(o.lat>n)n=o.lat;
    });
    if(!any)return null;
    const mx=Math.max((e-w)*0.05,0.01), my=Math.max((n-s)*0.05,0.01);
    return {s:s-my,w:w-mx,n:n+my,e:e+mx};
  }
  return null;   /* view = 현재 화면 그대로 */
}
function kBounds(b){ return new kakao.maps.LatLngBounds(new kakao.maps.LatLng(b.s,b.w),new kakao.maps.LatLng(b.n,b.e)); }
/* 지도 컨테이너를 용지 비율로 바꾸고 영역을 맞춘 뒤, 되돌리는 함수를 돌려줍니다 */
function applyExportView(paperMode,areaKind){
  const m=document.getElementById('map');
  const css=m.getAttribute('style')||'';
  const ab=areaBounds(areaKind);
  const pp=paperPx(paperMode);
  const oldW=CV.W, oldH=CV.H;
  if(useKakao&&kmap){
    const keepC=kmap.getCenter(), keepL=kmap.getLevel(), keepB=kmap.getBounds();
    m.style.width=pp.w+'px'; m.style.height=pp.h+'px';
    kmap.relayout();
    kmap.setBounds(ab?kBounds(ab):keepB,0,0);
    renderKakao();
    return ()=>{ m.setAttribute('style',css); kmap.relayout(); kmap.setCenter(keepC); kmap.setLevel(keepL); renderKakao(); };
  }
  const keep={cx:CV.cx,cy:CV.cy,z:CV.z};
  m.style.width=pp.w+'px'; m.style.height=pp.h+'px';
  sizeCanvas();
  if(ab){
    CV.cx=(ab.w+ab.e)/2; CV.cy=(ab.s+ab.n)/2;
    CV.z=Math.min(CV.W/(ab.e-ab.w),CV.H/((ab.n-ab.s)*0.79))*0.96;
  }else{
    CV.z=keep.z*Math.min(CV.W/(oldW||CV.W),CV.H/(oldH||CV.H));
  }
  renderCanvas();
  return ()=>{ m.setAttribute('style',css); sizeCanvas(); CV.cx=keep.cx; CV.cy=keep.cy; CV.z=keep.z; renderCanvas(); };
}

/* ---------- 인쇄 · PDF (화면 영역 정확히 유지) ---------- */
const PRINT={on:false,mapCss:'',bounds:null,cvW:0,cvH:0,cvZ:0,cvCx:0,cvCy:0,backC:null,backL:0,ab:null};
const MM2PX=96/25.4, A4L=297, A4S=210, PMARGIN=8;   /* 여백 8mm */
function paperPx(mode){
  let land;
  if(mode==='land')land=true;
  else if(mode==='port')land=false;
  else { const s=mapSize(); land = s[0]>=s[1]; }
  const w=(land?A4L:A4S)-PMARGIN*2, h=(land?A4S:A4L)-PMARGIN*2;
  return {land:land, w:Math.round(w*MM2PX), h:Math.round(h*MM2PX)};
}
function setPageRule(land){
  let st=document.getElementById('pageRule');
  if(!st){st=document.createElement('style');st.id='pageRule';document.head.appendChild(st);}
  st.textContent='@page{size:A4 '+(land?'landscape':'portrait')+';margin:'+PMARGIN+'mm}';
}
function beginPrint(){
  if(PRINT.on)return;
  const m=document.getElementById('map');
  const pp=paperPx(document.getElementById('exPaper').value);
  setPageRule(pp.land);
  PRINT.mapCss=m.getAttribute('style')||'';
  const ab=areaBounds(exVal('exArea','view'));
  /* 인쇄가 끝나면 되돌릴 "지금 보던 상태"를 기억 */
  if(useKakao&&kmap){
    PRINT.backC=kmap.getCenter(); PRINT.backL=kmap.getLevel();
    PRINT.bounds = ab ? kBounds(ab) : kmap.getBounds();
  }
  else { PRINT.cvZ=CV.z; PRINT.cvCx=CV.cx; PRINT.cvCy=CV.cy; PRINT.cvW=CV.W; PRINT.cvH=CV.H; PRINT.ab=ab; }
  /* 용지 실측 픽셀로 지도 컨테이너 고정 */
  m.style.width=pp.w+'px'; m.style.height=pp.h+'px';
  const ttl=(document.getElementById('exTitle').value||'').trim();
  const ps=document.getElementById('pstamp');
  ps.innerHTML = ttl ? (esc(ttl)+'<span>'+new Date().toLocaleDateString('ko-KR')+'</span>') : '';
  ps.style.visibility = ttl?'visible':'hidden';
  if(useKakao&&kmap){
    kmap.relayout();
    if(PRINT.bounds)kmap.setBounds(PRINT.bounds,0,0);   /* 보던 범위를 누락 없이 재적용 */
  }else{
    /* 간이지도: 세로 축척을 유지한 채 폭 변화만큼 중심 기준 재배치 */
    sizeCanvas();
    if(PRINT.ab){
      const b=PRINT.ab;
      CV.cx=(b.w+b.e)/2; CV.cy=(b.s+b.n)/2;
      CV.z=Math.min(CV.W/(b.e-b.w),CV.H/((b.n-b.s)*0.79))*0.96;
    }else{
      CV.cx=PRINT.cvCx; CV.cy=PRINT.cvCy;
      CV.z=PRINT.cvZ*Math.min(pp.w/(PRINT.cvW||pp.w), pp.h/(PRINT.cvH||pp.h));
    }
    renderCanvas();
  }
  PRINT.on=true;
}
function endPrint(){
  if(!PRINT.on)return;
  const m=document.getElementById('map');
  m.setAttribute('style',PRINT.mapCss);
  if(useKakao&&kmap){
    kmap.relayout();
    if(PRINT.backC){ kmap.setCenter(PRINT.backC); kmap.setLevel(PRINT.backL); }
    else if(PRINT.bounds) kmap.setBounds(PRINT.bounds,0,0);
    renderKakao();
  }else{
    sizeCanvas();
    CV.cx=PRINT.cvCx; CV.cy=PRINT.cvCy; CV.z=PRINT.cvZ;
    renderCanvas();
  }
  PRINT.on=false;
}
window.addEventListener('beforeprint',beginPrint);
window.addEventListener('afterprint',endPrint);
if(window.matchMedia){
  const mq=window.matchMedia('print');
  const h=e=>{ e.matches?beginPrint():endPrint(); };
  mq.addEventListener ? mq.addEventListener('change',h) : mq.addListener(h);
}

    }

    cv.toBlob(b=>{
      if(!b){toast('이미지를 만들지 못했습니다');return;}
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=nm+(png?'.png':'.jpg'); a.click();
      toast('이미지를 저장했습니다');
    }, png?'image/png':'image/jpeg', 0.92);
  },260);
};

let kbusy=false;
function loadKakao(k){
  if(kbusy||useKakao)return; kbusy=true;
  localStorage.setItem('kakao_key',k);
  localStorage.setItem('kakao_auto',document.getElementById('kauto').checked?'1':'0');
  const sc=document.createElement('script');
  sc.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey='+encodeURIComponent(k);
  sc.onerror=()=>{kbusy=false;kdiag('SDK 스크립트를 내려받지 못했습니다. 네트워크·사내 방화벽·광고차단 확장 프로그램을 확인하세요.<br><br>'+CHECKLIST);};
  sc.onload=()=>{
    try{kakao.maps.load(initKakao);}
    catch(e){kbusy=false;kdiag('SDK는 받았지만 초기화에 실패했습니다: '+e.message+'<br><br>'+CHECKLIST);}
  };
  document.head.appendChild(sc);
  setTimeout(()=>{
    if(!useKakao){kbusy=false;kdiag('7초 안에 지도가 뜨지 않았습니다. 키 또는 도메인 설정 문제일 가능성이 큽니다.<br><br>'+CHECKLIST);}

function initKakao(){

  kmap=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.45,127.05),level:11});

  const T=kakao.maps.MapTypeId;
  const bind=(id,t)=>{let on=false;document.getElementById(id).onclick=function(){on=!on;on?kmap.addOverlayMapTypeId(t):kmap.removeOverlayMapTypeId(t);this.style.background=on?'#dbeafe':'#fff';};};
  bind('tTerrain',T.TERRAIN);bind('tCadastral',T.USE_DISTRICT);bind('tHybrid',T.HYBRID);
  kakao.maps.event.addListener(kmap,'zoom_changed',render);
  kakao.maps.event.addListener(kmap,'dragend',render);
  kakao.maps.event.addListener(kmap,'click',e=>{
    if(!mode)return;
    const ll=e.latLng; onMapClick(ll.getLng(),ll.getLat());
  });
  kakao.maps.event.addListener(kmap,'dblclick',()=>{if(mode==='draw')finishDraw();});
  render();toast('카카오맵을 불러왔습니다');
}
